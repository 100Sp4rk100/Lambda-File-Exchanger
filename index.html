<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Lambda File Exchanger</title>
        <link rel="stylesheet" href="style/global.css">
        <script type="module" src="./JS/main.js"></script>
        <link rel="icon" type="image/png" href="./images/icon.png">
    </head>
    <body>
        <header>
            <img src="./images/lambda.png" alt="lambda image">
        </header>
        <div id="title_p">
            <h1 class="title">Lambda File Exchanger</h1>
            <h3>Manage files of Lambda</h3>
        </div>
        <main>
            <h1 class="title">External files</h1>
            <button id="load_external_files">Loads files</button>
            <button id="sync_external_files">Syncronise files</button>
            <button id="format_external">Format</button>
            <label for="upload_external" id="upload_external_txt" class="file_input_label">Upload a file</label>
            <input type="file" id="upload_external">
            <br>
            <br>
            <section class="color_grid">
                <div id="external_files_list">
                    <br>
                </div>
            </section>
            <br>
            <h1 class="title">Internal files</h1>
            <button id="load_internal_files">Loads files</button>
            <button id="sync_internal_files">Syncronise files</button>
            <button id="format_internal">Format</button>
            <label for="upload_internal" id="upload_internal_txt" class="file_input_label">Upload a file</label>
            <input type="file" id="upload_internal">
            <br>
            <br>
            <section class="color_grid">
                <div id="internal_files_list">
                    <br>
                </div>
            </section>
            <br>
            Console :
            <section class="style_part">
                <div id="console" style="overflow:scroll; height:400px;"></div>
            </section>
        </main>
        <br>
        <footer>
            <a href="https://github.com/100Sp4rk100/Lambda-Theme-Maker-WebSite">WebSite Source Code</a>
            <br>
            <a href="https://github.com/100Sp4rk100/Lambda-OS">Userland Source Code</a>
            <br>
            <a href="https://github.com/100Sp4rk100">Made by 100Sp4rk100</a>
        </footer>
    </body>
</html>
